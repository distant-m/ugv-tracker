<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вхід</title>
<style>
:root{--bg:#f3f4f2;--card:#fff;--line:#d5d9d0;--fg:#18201a;--muted:#5c665e;--accent:#4f6230}
@media (prefers-color-scheme:dark){:root{--bg:#0f1310;--card:#171c18;--line:#2f382f;--fg:#e5e9e3;--muted:#9aa59b;--accent:#a8bd72}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;width:min(360px,calc(100% - 32px))}
h1{font-size:18px;margin:0 0 6px}p{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<main>
<h1>Вхід у систему</h1>
<p>Система налаштовується. Вхід буде доступний найближчим часом.</p>
</main>
</body>
</html>
